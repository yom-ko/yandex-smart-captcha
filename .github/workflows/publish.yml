name: Publish to pub.dev

on:
  push:
    tags:
      # Must match the tag pattern configured on pub.dev: v{{version}}.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions: {}

jobs:
  main:
    uses: ./.github/workflows/main.yml
    permissions:
      contents: read
      # Required for nested permissions validation.
      id-token: write

  publish:
    needs: main
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1.8.1
    permissions:
      id-token: write
    with:
      environment: pub.dev
