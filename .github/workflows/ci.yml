name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check-agent-context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./build-agent-context.sh --check

  test:
    needs: check-agent-context
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --coverage
      - run: flutter test --platform chrome
      - uses: codecov/codecov-action@v7
        with:
          files: coverage/lcov.info
          use_oidc: true
