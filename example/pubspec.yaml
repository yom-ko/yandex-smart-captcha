name: example
description: Example app demonstrating yandex_smart_captcha usage.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  yandex_smart_captcha:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  patrol: ^4.9.0

flutter:
  uses-material-design: true

patrol:
  app_name: Example
  test_directory: integration_test
  android:
    package_name: com.example.example
  ios:
    bundle_id: com.example.example
  macos:
    bundle_id: com.example.example
