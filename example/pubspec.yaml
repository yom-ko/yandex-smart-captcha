name: example
description: Example app demonstrating yandex_smart_captcha usage.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter

  material_ui: ^1.11.0
  yandex_smart_captcha:
    path: ..

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  patrol: ^4.11.0
  patrol_mcp: ^0.2.2

flutter:
  uses-material-design: true

patrol:
  app_name: Example
  test_directory: integration_test
  android:
    package_name: com.example.example
  ios:
    bundle_id: com.example.example
  macos:
    bundle_id: com.example.example
